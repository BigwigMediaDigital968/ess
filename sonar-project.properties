# ──────────────────────────────────────────────────────────────────────────────
#  SonarQube / SonarCloud Project Configuration
#  ESS-BSL — Enterprise Self-Service & Business Services Layer
# ──────────────────────────────────────────────────────────────────────────────

sonar.projectKey=ESS-BSL
sonar.projectName=ESS-BSL Platform
sonar.projectVersion=1.0.0

# Source paths
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src/__tests__

# Language settings
sonar.javascript.node.maxspace=4096
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions — generated code, build artifacts, node_modules
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/.prisma/**,\
  **/prisma/migrations/**,\
  **/*.min.js,\
  **/*.test.js,\
  **/*.spec.js,\
  **/public/**

sonar.coverage.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/prisma/**,\
  **/seed*.js,\
  **/__mocks__/**

# Security hotspot detection
sonar.security.hotspot.threshold=MEDIUM

# Quality Gate
sonar.qualitygate.wait=true

# Duplication threshold
sonar.cpd.js.minimumLines=10
sonar.cpd.js.minimumTokens=100

# Issue severity
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S1481
sonar.issue.ignore.multicriteria.e1.resourceKey=**/migrations/**
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S125
sonar.issue.ignore.multicriteria.e2.resourceKey=**/seed*.js