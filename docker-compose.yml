
services:
  postgres:
    image: postgres:15-alpine
    container_name: ess_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ess_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-ess_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ess_backend
    restart: always
    ports:
      - "3434:3434"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-ess_db}
      PORT: 3434
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://ess_portal:3434}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    networks:
      default:
        aliases:
          - ess_portal
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3434/api}
    container_name: ess_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  nextcloud:
    image: nextcloud
    container_name: ess_nextcloud
    restart: always
    ports:
      - "8080:80"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - NEXTCLOUD_ADMIN_USER=${NC_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NC_ADMIN_PASSWORD:-password}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - nextcloud_data:/var/www/html
      - ./nextcloud-entrypoint.sh:/custom-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/custom-entrypoint.sh"]
    extra_hosts:
      - "ess_portal:host-gateway"

volumes:
  postgres_data:
  nextcloud_data:
  backend_uploads:

