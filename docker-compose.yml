services:
  postgres:
    image: postgres:15-alpine
    container_name: ess_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ess_db}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-ess_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ess_backend
    restart: always
    ports:
      - "3434:3434"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-ess_db}
      PORT: 3434
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://ess_portal:3434}
      FRONTEND_URL: ${FRONTEND_URL:-http://ess.bigwigmediadigital.com:5173}
      REDIS_URL: redis://redis:6379
      PAYROLL_SVC_URL: http://payroll-service:3435
      NOTIF_SVC_URL: http://notification-svc:3436
    networks:
      default:
        aliases:
          - ess_portal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ess_uploads:/app/uploads
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://ess.bigwigmediadigital.com:3434/api}
    container_name: ess_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

  nextcloud:
    image: nextcloud
    container_name: ess_nextcloud
    restart: always
    ports:
      - "8081:80"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD:-password}
      NEXTCLOUD_TRUSTED_DOMAINS: ess.bigwigmediadigital.com
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - nextcloud_data:/var/www/html
      - ./nextcloud-entrypoint.sh:/custom-entrypoint.sh:ro
    entrypoint: [ "/bin/bash", "/custom-entrypoint.sh" ]
    extra_hosts:
      - "ess_portal:host-gateway"

  redis:
    image: redis:7-alpine
    container_name: ess_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  nextcloud_data:
  redis_data:
  ess_uploads:
